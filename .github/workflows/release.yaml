name: Build and Archive

on:
  push:
    tags:
      - 'v*'           # 只有打 tag 时才触发完整发布
  workflow_dispatch:    # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      # 上传到 Artifacts（工作流产物）
      - name: Upload windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows
          archive: true