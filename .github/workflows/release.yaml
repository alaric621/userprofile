name: Build and Archive

on:
  push:
    branches:
      - main        # 当推送到 main 分支时触发
      - develop                # 只有打 tag 时才触发完整发布
  workflow_dispatch:    # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
       
      - name: checkout
        uses: actions/checkout@v4
      - name: show dir 
        run: ls -al 
      # 上传到 Artifacts（工作流产物）
      - name: Upload windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: windows/
          archive: true
          include-hidden-files: true
      - name: Upload linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: linux/
          archive: true
          include-hidden-files: true
  release:
    runs-on: ubuntu-latest
    needs: build  # 等待 build job 完成
    # 只在 main 分支推送时触发发布
    permissions:
      contents: write    # 允许创建 Release 和修改仓库内容
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts  # 下载到 artifacts 目录
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.sha }}"
          tag_name: "v${{ github.run_number }}"  # 自动生成版本号
          files: |
            ./artifacts/windows/**/*
            ./artifacts/linux/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}